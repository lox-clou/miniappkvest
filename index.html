        // Рандомный спавн предметов
        function randomizeItems() {
            const shuffled = [...allItems].sort(() => Math.random() - 0.5);
            const keyForSecret = ['book2', 'crown', 'mask', 'chest', 'crystal'];
            const remainingItems = shuffled.filter(item => !keyForSecret.includes(item.id));
            
            const itemsPerRoom = {};
            regularRooms.forEach(room => {
                itemsPerRoom[room] = [];
            });
            
            const roomsWithItems = Math.floor(regularRooms.length * 0.6);
            const shuffledRooms = [...regularRooms].sort(() => Math.random() - 0.5);
            const selectedRooms = shuffledRooms.slice(0, roomsWithItems);
            
            let itemIndex = 0;
            for (let room of selectedRooms) {
                const itemCount = Math.random() > 0.5 ? 1 : 2;
                for (let i = 0; i < itemCount; i++) {
                    if (itemIndex < remainingItems.length) {
                        itemsPerRoom[room].push({...remainingItems[itemIndex]});
                        itemIndex++;
                    }
                }
            }
            
            return itemsPerRoom;
        }

                check: (state) => state.inventory.includes('hourglass') && state.flags.mirror_seen === true && state.location === 'attic'
            },
            fortune: { 
                name: '🎴 СУДЬБА', 
                desc: 'Карты Таро предсказали твою судьбу. Ты принял свою участь.', 
                type: 'neutral',
                emoji: '🎴',
                check: (state) => state.inventory.includes('tarot') && state.sanity < 30 && state.flags.tarot_read === true
            },
            mage: { 
                name: '🔮 МАГ', 
                desc: 'Ты овладел древней магией. Теперь ты настоящий маг.', 
                type: 'good',
                emoji: '🔮',
                check: (state) => state.inventory.includes('crystal') && state.inventory.includes('scroll') && state.inventory.includes('book1') && state.flags.spell_cast === true
            },
            cursed: { 
                name: '⚰️ ПРОКЛЯТИЕ', 
                desc: 'Проклятие настигло тебя. Ты стал частью особняка.', 
                type: 'bad',
                emoji: '⚰️',
                check: (state) => state.inventory.includes('skull') && state.inventory.includes('ring') && state.sanity < 40 && state.flags.cursed_ritual === true
            },
            light: { 
                name: '✨ СВЕТ', 
                desc: 'Ты нашел источник света и изгнал тьму из особняка.', 
                type: 'good',
                emoji: '✨',
                check: (state) => state.inventory.includes('candle') && state.inventory.includes('matches') && state.flags.light_ritual === true
            },
            shadow: { 
                name: '🌑 ТЕНЬ', 
                desc: 'Ты слился с тенями. Теперь ты невидим для призраков.', 
                type: 'secret',
                emoji: '🌑',
                check: (state) => state.inventory.includes('feather') && state.sanity > 80 && state.flags.shadow_merge === true
            },
            alchemist: { 
                name: '⚗️ АЛХИМИК', 
                desc: 'Ты создал эликсир бессмертия! Но цена была высока...', 
                type: 'good',
                emoji: '⚗️',
                check: (state) => state.inventory.includes('potion') && state.inventory.includes('crystal') && state.health > 90 && state.flags.alchemy === true
            },
            broken: { 
                name: '🪞 ОСКОЛКИ', 
                desc: 'Разбитое зеркало показало тебе все твои страхи.', 
                type: 'bad',
                emoji: '🪞',
                check: (state) => state.inventory.includes('mirror_shard') && state.sanity < 20 && state.flags.mirror_broken === true
            },
            king: { 
                name: '👑 КОРОЛЬ', 
                desc: 'Корона дает тебе власть над всеми духами особняка.', 
                type: 'secret',
                emoji: '👑',
                check: (state) => state.inventory.includes('crown') && state.inventory.includes('ring') && state.inventory.includes('book2') && state.flags.coronation === true
            },
            ritual: { 
                name: '🕯️ РИТУАЛ', 
                desc: 'Древний ритуал завершен. Ты открыл портал в другой мир.', 
                type: 'secret',
                emoji: '🕯️',
                check: (state) => state.inventory.includes('candle') && state.inventory.includes('knife') && state.inventory.includes('mask') && state.flags.portal_opened === true
            },
            wanderer: { 
                name: '🚶 СТРАННИК', 
                desc: 'Ты решил остаться и присматривать за особняком.', 
                type: 'neutral',
                emoji: '🚶',
                check: (state) => state.inventory.length > 10 && state.sanity > 70 && state.health > 70 && state.flags.wanderer_choice === true
            },
            astronomer: {
                name: '🔭 АСТРОНОМ',
                desc: 'Ты увидел в телескоп другие миры. Тайны вселенной открылись тебе.',
                type: 'good',
                emoji: '🔭',
                check: (state) => state.inventory.includes('spyglass') && state.location === 'observatory' && state.flags.stars_seen === true
            }
        };

        let itemsByLocation = randomizeItems();

        function setBackground(bgKey) {
            document.getElementById('dynamicBg').style.background = bgColors[bgKey] || bgColors.start;
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function showNote(text) {
            const note = document.createElement('div');
            note.className = 'note-popup';
            note.innerHTML = `
                <div class="note-text">📜 ${text}</div>
                <button class="note-close" onclick="this.parentElement.remove()">Понятно</button>
            `;
            document.body.appendChild(note);
        }

        // ГЛАВНАЯ ФУНКЦИЯ ПРОВЕРКИ КОНЦОВОК
        function checkAllEndings() {
            for (let [key, ending] of Object.entries(endings)) {
                if (ending.check(gameState)) {
                    if (!endingsUnlocked.includes(key)) {
                        endingsUnlocked.push(key);
                        localStorage.setItem('endingsUnlocked', JSON.stringify(endingsUnlocked));
                        
                        // ВАЖНО: ОТПРАВЛЯЕМ КОНЦОВКУ В БОТА
                        console.log('🎯 Новая концовка:', key);
                        sendEndingToBot(key);
                        
                        // Отправляем в Telegram (альтернативный способ)
                        if (tg) {
                            tg.sendData(JSON.stringify({
                                type: 'ending_unlocked',
                                ending: key,
                                endings: endingsUnlocked
                            }));
                        }
                        
                        showToast(`✨ Новая концовка: ${ending.name}`);
                    }
                    gameState.ending = key;
                    return true;
                }
            }
            return false;
        }

        function searchRoom() {
            const loc = locations[gameState.location] || secretRooms[gameState.location];
            if (!loc) return;
            
            if (loc.items && loc.items.length > 0) {
                const newItems = loc.items.filter(item => 
                    !gameState.foundItems.some(f => f.id === item.id)
                );
                
                if (newItems.length > 0) {
                    gameState.foundItems = [...gameState.foundItems, ...newItems];
                    showToast('🔍 Ты что-то нашел!');
                } else {
                    showToast('🔍 Больше ничего нет...');
                }
            } else {
                showToast('🔍 Здесь пусто...');
            }
            
            gameState.searched = true;
            render();
        }

        function takeItem(itemId) {
            if (!gameState.foundItems.some(f => f.id === itemId)) return;
            
            const item = gameState.foundItems.find(f => f.id === itemId);
            gameState.foundItems = gameState.foundItems.filter(f => f.id !== itemId);
            gameState.inventory.push(itemId);
            
            const loc = locations[gameState.location] || secretRooms[gameState.location];
            if (loc) {
                const itemIndex = loc.items.findIndex(i => i.id === itemId);
                if (itemIndex !== -1) {
                    loc.items.splice(itemIndex, 1);
                }
            }
            
            showToast(`✅ Взят: ${item.name}`);
            
            if (itemId.includes('note')) {
                showNote('"Тени повсюду... они следят за тобой..."');
                gameState.sanity -= 3;
            }
            if (itemId.includes('book')) {
                showNote('"Тьма внутри тебя становится сильнее..."');
                gameState.sanity -= 5;
            }
            if (itemId === 'ring') {
                showNote('Кольцо обжигает палец холодом...');
                gameState.sanity -= 8;
            }
            
            render();
        }

        function doAction(actionCode) {
            if (gameState.ending) return;
            
            const loc = locations[gameState.location] || secretRooms[gameState.location];
            if (!loc) return;
            
            // Проверка на открытие секретных комнат
            if (actionCode === 'search_secret' && gameState.location === 'library') {
                if (gameState.inventory.includes('book1') && !gameState.secretRoomsFound.includes('secret_library')) {
                    gameState.location = 'secret_library';
                    gameState.secretRoomsFound.push('secret_library');
                    gameState.searched = false;
                    gameState.foundItems = [];
                    setBackground(bgColors.secret_library);
                    showToast('🔓 Книжный шкаф открывается!');
                    render();
                    return;
                }
            }
            
            if (actionCode === 'search' && gameState.location === 'living_room') {
                if (gameState.inventory.includes('key') && !gameState.secretRoomsFound.includes('hidden_chamber')) {
                    gameState.location = 'hidden_chamber';
                    gameState.secretRoomsFound.push('hidden_chamber');
                    gameState.searched = false;
                    gameState.foundItems = [];
                    setBackground(bgColors.hidden_chamber);
                    showToast('🔓 Картина открывает проход!');
                    render();
                    return;
                }
            }
            
            if (actionCode === 'search' && gameState.location === 'basement') {
                if (gameState.inventory.includes('key') && !gameState.secretRoomsFound.includes('treasure_vault')) {
                    gameState.location = 'treasure_vault';
                    gameState.secretRoomsFound.push('treasure_vault');
                    gameState.searched = false;
                    gameState.foundItems = [];
                    setBackground(bgColors.treasure_vault);
                    showToast('🔓 Тайная дверь открывается!');
                    render();
                    return;
                }
            }
            
            if (actionCode === 'ritual' && gameState.location === 'basement') {
                if (gameState.inventory.includes('knife') && !gameState.secretRoomsFound.includes('ritual_room')) {
                    gameState.location = 'ritual_room';
                    gameState.secretRoomsFound.push('ritual_room');
                    gameState.searched = false;
                    gameState.foundItems = [];
                    setBackground(bgColors.ritual_room);
                    showToast('🔮 Ритуал открывает проход!');
                    render();
                    return;
                }
            }
            
            if (actionCode === 'search' && gameState.location === 'attic') {
                if (gameState.inventory.includes('spyglass') && !gameState.secretRoomsFound.includes('observatory')) {
                    gameState.location = 'observatory';
                    gameState.secretRoomsFound.push('observatory');
                    gameState.searched = false;
                    gameState.foundItems = [];
                    setBackground(bgColors.observatory);
                    showToast('🔓 Телескоп показывает потайную дверь!');
                    render();
                    return;
                }
            }
            
            if (locations[actionCode]) {
                gameState.location = actionCode;
                gameState.searched = false;
                gameState.foundItems = [];
                setBackground(locations[actionCode].bg);
                showToast(`🚪 Переход в ${locations[actionCode].name}`);
                render();
                return;
            }
            
            if (secretRooms[gameState.location] && secretRooms[gameState.location].actions) {
                const secret = secretRooms[gameState.location];
                for (let action of secret.actions) {
                    if (action.action === actionCode) {
                        if (actionCode === 'search') {
                            searchRoom();
                            return;
                        } else if (actionCode === 'ritual') {
                            gameState.flags.ritual_completed = true;
                            showToast('🕯️ Ты проводишь ритуал...');
                            setTimeout(() => {
                                if (gameState.inventory.includes('knife') && gameState.inventory.includes('book1')) {
                                    showToast('✨ Ритуал успешен!');
                                } else {
                                    showToast('💀 Что-то пошло не так...');
                                    gameState.health -= 30;
                                }
                                if (checkAllEndings()) {
                                    render();
                                    return;
                                }
                                render();
                            }, 2000);
                            return;
                        } else {
                            gameState.location = action.action;
                            gameState.searched = false;
                            gameState.foundItems = [];
                            setBackground(bgColors[locations[action.action]?.bg] || bgColors.start);
                            showToast(`🚪 Возврат в особняк`);
                            render();
                            return;
                        }
                    }
                }
            }
            
            if (actionCode === 'escape') {
                gameState.flags.escape = true;
                if (checkAllEndings()) {
                    render();
                    return;
                }
            }
            else if (actionCode === 'search') {
                searchRoom();
            }
            else if (actionCode === 'call') {
                showToast('📞 Гудки...');
                setTimeout(() => showToast('📞 Никто не отвечает...'), 1000);
                setTimeout(() => {
                    showToast('📞 Только шум...');
                    gameState.sanity -= 5;
                    render();
                }, 2000);
                return;
            }
            else if (actionCode === 'listen') {
                const whispers = ['"Уходи..."', '"Помоги..."', '"Здесь опасно..."'];
                showToast(`👂 ${whispers[Math.floor(Math.random() * whispers.length)]}`);
                gameState.sanity -= 5;
            }
            else if (actionCode === 'mirror') {
                gameState.flags.mirror_seen = true;
                showToast('🪞 Зеркало затуманилось...');
                setTimeout(() => {
                    if (gameState.inventory.includes('glasses')) {
                        showToast('👓 Ты видишь призрака! -20 здоровья');
                        gameState.health -= 20;
                        gameState.flags.truth_seen = true;
                    } else {
                        showToast('👤 Силуэт исчез... -5 рассудка');
                        gameState.sanity -= 5;
                    }
                    if (checkAllEndings()) {
                        render();
                        return;
                    }
                    render();
                }, 1500);
                return;
            }
            else if (actionCode === 'ritual') {
                gameState.flags.ritual_completed = true;
                showToast('🕯️ Ты проводишь ритуал...');
                setTimeout(() => {
                    if (gameState.inventory.includes('knife') && gameState.inventory.includes('book1')) {
                        showToast('✨ Ритуал успешен!');
                    } else {
                        showToast('💀 Что-то пошло не так...');
                        gameState.health -= 30;
                    }
                    if (checkAllEndings()) {
                        render();
                        return;
                    }
                    render();
                }, 2000);
                return;
            }
            
            if (checkAllEndings()) {
                render();
                return;
            }
            
            render();
        }

        function newGame() {
            itemsByLocation = randomizeItems();
            
            for (let room of regularRooms) {
                if (itemsByLocation[room]) {
                    locations[room].items = itemsByLocation[room];
                } else {
                    locations[room].items = [];
                }
            }
            
            gameState = {
                location: 'start',
                inventory: [],
                foundItems: [],
                health: 100,
                sanity: 100,
                flags: {},
                searched: false,
                ending: null,
                inMenu: false,
                secretRoomsFound: []
            };
            
            setBackground(bgColors.start);
            showToast('🔄 Новая игра');
            render();
        }

        function showMenu() {
            gameState.inMenu = true;
            render();
        }

        function goToMenu() {
            gameState.inMenu = true;
            gameState.ending = null;
            render();
        }

        function render() {
            const app = document.getElementById('app');
            
            if (gameState.inMenu) {
                let endingsHtml = '';
                for (let [key, ending] of Object.entries(endings)) {
                    const unlocked = endingsUnlocked.includes(key);
                    endingsHtml += `
                        <div class="ending-item ${unlocked ? 'unlocked' : ''}">
                            <div class="emoji">${ending.emoji}</div>
                            <div class="name">${ending.name}</div>
                            <div class="desc">${unlocked ? ending.desc : '???'}</div>
                        </div>
                    `;
                }
                
                app.innerHTML = `
                    <div class="menu">
                        <h1>ЗАБРОШЕННЫЙ</h1>
                        <h1>ОСОБНЯК</h1>
                        <div class="menu-subtitle">15+ КОМНАТ • 5 СЕКРЕТНЫХ • 20 КОНЦОВОК</div>
                        
                        <button class="menu-btn" onclick="newGame()">
                            <span>🎮</span> НАЧАТЬ ИГРУ
                        </button>
                        
                        <div class="endings-list">
                            <div class="endings-title">
                                <span>🏆 КОНЦОВКИ (${endingsUnlocked.length}/20)</span>
                            </div>
                            <div class="endings-grid">
                                ${endingsHtml}
                            </div>
                        </div>
                    </div>
                `;
                return;
            }
            
            if (gameState.ending) {
                const end = endings[gameState.ending];
                
                app.innerHTML = `
                    <div class="ending">
                        <div class="ending-title ending-${end.type}">${end.name}</div>
                        <div class="ending-desc">${end.desc}</div>
                        <div class="stats">
                            <div class="stat-item"><div class="stat-value">${gameState.health}</div><div>❤️</div></div>
                            <div class="stat-item"><div class="stat-value">${gameState.sanity}</div><div>🧠</div></div>
                            <div class="stat-item"><div class="stat-value">${gameState.inventory.length}</div><div>🎒</div></div>
                        </div>
                        <div class="ending-buttons">
                            <button class="ending-btn" onclick="newGame()">🔄 НОВАЯ ИГРА</button>
                            <button class="ending-btn" onclick="goToMenu()">🏠 ГЛАВНОЕ МЕНЮ</button>
                        </div>
                    </div>
                `;
                return;
            }
            
            const loc = locations[gameState.location] || secretRooms[gameState.location];
            if (!loc) {
                gameState.location = 'hall';
                render();
                return;
            }
            
            const isSecret = Object.keys(secretRooms).includes(gameState.location);
            
            let atmosphereHtml = '';
            
            if (loc.atmosphere === 'hall') {
                atmosphereHtml = `
                    <div class="door door1"></div>
                    <div class="door door2"></div>
                    <div class="door door3"></div>
                `;
            } else if (loc.atmosphere === 'library') {
                atmosphereHtml = `
                    <div class="book book1"></div>
                    <div class="book book2"></div>
                    <div class="book book3"></div>
                `;
            } else if (loc.atmosphere === 'attic') {
                atmosphereHtml = `
                    <div class="mirror"></div>
                    <div class="shadow"></div>
                    <div class="dust" style="left: 10%; animation-delay: 0s;"></div>
                    <div class="dust" style="left: 30%; animation-delay: 2s;"></div>
                    <div class="dust" style="left: 50%; animation-delay: 4s;"></div>
                `;
            } else if (loc.atmosphere === 'dining_room') {
                atmosphereHtml = `<div class="whisper">👤</div>`;
            } else if (loc.atmosphere === 'crypt') {
                atmosphereHtml = `<div class="dust" style="left: 20%;"></div><div class="dust" style="left: 70%;"></div>`;
            } else if (loc.atmosphere === 'observatory') {
                atmosphereHtml = `<div class="book book1"></div><div class="book book2"></div>`;
            } else if (loc.atmosphere === 'ritual_room') {
                atmosphereHtml = `<div class="mirror"></div>`;
            }
            
            let html = `
                <div class="header">
                    <h1>ЗАБРОШЕННЫЙ</h1>
                    <h1>ОСОБНЯК</h1>
                    <div class="location-badge" onclick="goToMenu()">📍 ${loc.name} (меню)</div>
                </div>
                
                <div class="location-card">
                    <div class="atmosphere">${atmosphereHtml}</div>
                    ${isSecret ? '<div class="secret-indicator">🔮 СЕКРЕТНАЯ КОМНАТА</div>' : ''}
                    <div class="location-name">${loc.name}</div>
                    <div class="location-desc">${loc.desc}</div>
                </div>
                
                <div class="stats">
                    <div class="stat-item"><div class="stat-value">${gameState.health}</div><div class="stat-label">❤️</div></div>
                    <div class="stat-item"><div class="stat-value">${gameState.sanity}</div><div class="stat-label">🧠</div></div>
                    <div class="stat-item"><div class="stat-value">${gameState.inventory.length}</div><div class="stat-label">🎒</div></div>
                </div>
            `;
            
            html += `
                <button class="search-btn" onclick="searchRoom()">
                    <span>🔍</span> ОСМОТРЕТЬСЯ
                </button>
            `;
            
            if (gameState.foundItems.length > 0) {
                html += `
                    <div class="found-items visible">
                        <div class="found-title">
                            <span>📦 НАЙДЕНО В КОМНАТЕ:</span>
                        </div>
                        <div class="found-grid">
                            ${gameState.foundItems.map(item => 
                                `<div class="found-item" onclick="takeItem('${item.id}')">${item.name}</div>`
                            ).join('')}
                        </div>
                    </div>
                `;
            }
            
            html += `
                <button class="take-btn" ${gameState.foundItems.length === 0 ? 'disabled' : ''} 
                        onclick="if(${gameState.foundItems.length > 0}) takeItem(gameState.foundItems[0].id)">
                    <span>🎒</span> ВЗЯТЬ ПРЕДМЕТЫ
                </button>
            `;
            
            html += `<div class="actions">`;
            loc.actions.forEach(action => {
                html += `<button class="action-btn" onclick="doAction('${action.action}')">${action.text}</button>`;
            });
            html += `</div>`;
            
            if (gameState.inventory.length > 0) {
                html += `
                    <div class="inventory">
                        <div class="inventory-title">
                            <span>🎒 ИНВЕНТАРЬ</span>
                            <span class="menu-btn-small" onclick="goToMenu()">🏠 МЕНЮ</span>
                        </div>
                        <div class="inventory-items">
                            ${gameState.inventory.map(id => {
                                const item = allItems.find(i => i.id === id);
                                return `<span class="inventory-item">${item ? item.name : id}</span>`;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="inventory">
                        <div class="inventory-title">
                            <span>🎒 ИНВЕНТАРЬ</span>
                            <span class="menu-btn-small" onclick="goToMenu()">🏠 МЕНЮ</span>
                        </div>
                        <div>Пусто</div>
                    </div>
                `;
            }
            
            app.innerHTML = html;
        }

        window.onload = () => {
            setBackground(bgColors.start);
            showMenu();
            
            tg.MainButton.setText('💾 СОХРАНИТЬ');
            tg.MainButton.onClick(() => {
                tg.sendData(JSON.stringify({
                    gameState: gameState,
                    endingsUnlocked: endingsUnlocked
                }));
                showToast('💾 Сохранено!');
            });
            tg.MainButton.show();
        };
    </script>
</body>
</html>
